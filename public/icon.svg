<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="radar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Subsurface Ground Line (Z = 0) -->
  <line x1="48" y1="120" x2="464" y2="120" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <rect x="48" y="120" width="416" height="320" fill="url(#glow)" rx="16"/>

  <!-- Radar Grid Lines (Depth cm) -->
  <line x1="48" y1="190" x2="464" y2="190" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="48" y1="260" x2="464" y2="260" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="48" y1="330" x2="464" y2="330" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="48" y1="400" x2="464" y2="400" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Vertical Profile Lines -->
  <line x1="152" y1="120" x2="152" y2="440" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="256" y1="120" x2="256" y2="440" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="360" y1="120" x2="360" y2="440" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- GPR Antenna Pulse (Transmitter) -->
  <path d="M256 64 L220 120 L292 120 Z" fill="#10b981"/>
  <circle cx="256" cy="64" r="16" fill="#f59e0b"/>

  <!-- Radiating Radar Wavefronts -->
  <path d="M200 150 A 70 70 0 0 0 312 150" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <path d="M160 180 A 120 120 0 0 0 352 180" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
  <path d="M120 210 A 170 170 0 0 0 392 210" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>

  <!-- Buried Hyperbolic Diffraction Target (GPR Pipe / Void) -->
  <path d="M140 370 Q 256 250 372 370" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="275" r="22" fill="#ef4444" stroke="#ffffff" stroke-width="4"/>

  <!-- Depth Marker Tag -->
  <rect x="288" y="255" width="110" height="34" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="343" y="278" font-family="monospace" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">Z: 115cm</text>
</svg>
